[defaults]
inventory = inventory.yml
# Collections live next to the playbook, so uvx's throwaway Ansible finds them.
collections_path = ./collections
# Don't prompt for the router's host key. Note: ansible.netcommon 8.x still rejects a key
# that differs from ~/.ssh/known_hosts (see README.md, "host key mismatch").
host_key_checking = False

[persistent_connection]
# RouterOS runs under QEMU emulation on Apple Silicon, so give it time.
connect_timeout = 60
command_timeout = 120
